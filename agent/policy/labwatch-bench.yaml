# Generated by python3 -m agent.policy.build; edit build.py, not this file.
# NemoClaw custom preset: nemoclaw <sandbox> policy add --from-file <this> --yes
preset:
  name: "labwatch-bench"
  description: "Lab Watch: the bench endpoint on the docker bridge only"
network_policies:
  labwatch_bench:
    name: "labwatch_bench"
    endpoints:
      - host: "host.openshell.internal"
        port: 8765
        protocol: "rest"
        enforcement: "enforce"
        allowed_ips:
          - "172.18.0.1/32"
        rules:
          - allow:
              method: "GET"
              path: "/health"
          - allow:
              method: "GET"
              path: "/board"
          - allow:
              method: "GET"
              path: "/incidents"
          - allow:
              method: "GET"
              path: "/incidents/*"
          - allow:
              method: "GET"
              path: "/runs"
          - allow:
              method: "GET"
              path: "/runs/*"
          - allow:
              method: "GET"
              path: "/events"
          - allow:
              method: "GET"
              path: "/show"
          - allow:
              method: "POST"
              path: "/run"
          - allow:
              method: "POST"
              path: "/board/test"
    binaries:
      - path: "/usr/bin/python3"
      - path: "/usr/bin/python3.13"
