<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local Lab Board</title>
<style>
:root {
  --bg: #0a0d12; --panel: #141a22; --line: #26313d; --text: #f2f5f8; --dim: #8c99a6;
  --ok: #2ee06f; --bad: #ff3b3b; --warn: #ffb020; --unk: #7a8592;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font-family: "DejaVu Sans", "Liberation Sans", Arial, sans-serif; overflow: hidden; }
body { display: grid; grid-template-rows: auto auto 1fr auto auto;
  grid-template-columns: minmax(0, 1fr); height: 100vh; width: 100vw; }
#head { padding: 26px 48px 22px; border-bottom: 6px solid var(--unk); background: #161b22; }
#head.ok { border-color: var(--ok); background: #0c2716; }
#head.bad { border-color: var(--bad); background: #3a0d10; }
#head.warn, #head.stop { border-color: var(--warn); background: #33250a; }
#htext { font-size: 64px; font-weight: 800; line-height: 1.15; }
#head.ok #htext { color: var(--ok); } #head.bad #htext { color: #ff6b6b; }
#head.warn #htext, #head.stop #htext { color: var(--warn); }
#head.unknown #htext { color: #c3cbd3; }
#hsub { font-size: 34px; color: #d0d7de; margin-top: 10px; min-height: 40px; }
#stale { display: none; background: #3a424c; color: #fff; font-size: 34px; font-weight: 700;
  padding: 12px 48px; }
#stale.on { display: block; }
main { display: grid; grid-template-columns: minmax(0, 56fr) minmax(0, 44fr); gap: 40px;
  padding: 24px 48px; min-height: 0; }
#board { width: 100%; height: 100%; min-height: 0; }
#rows { display: flex; flex-direction: column; justify-content: center; gap: 18px; min-height: 0; }
.row { display: flex; align-items: center; gap: 24px; background: var(--panel);
  border-left: 10px solid var(--unk); border-radius: 14px; padding: 14px 24px; }
.row .ic { flex: none; width: 64px; height: 64px; border-radius: 50%; display: flex;
  align-items: center; justify-content: center; font-size: 40px; font-weight: 900;
  color: #0a0d12; background: var(--unk); }
.row .tx { min-width: 0; overflow: hidden; }
.row .w { font-size: 38px; font-weight: 700; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; }
.row .w b { font-weight: 800; }
.row .t { font-size: 20px; color: var(--dim); margin-top: 2px; }
.row.ok { border-color: var(--ok); } .row.ok .ic { background: var(--ok); }
.row.bad { border-color: var(--bad); background: #2a1013; } .row.bad .ic { background: var(--bad); }
.row.bad .w b { color: #ff6b6b; }
.row.warn { border-color: var(--warn); } .row.warn .ic { background: var(--warn); }
.row.warn .w b { color: var(--warn); }
.row.unknown .w b { color: var(--unk); }
#tl { padding: 18px 48px 14px; background: #10151c; border-top: 2px solid var(--line); }
#steps { display: flex; align-items: center; gap: 18px; font-size: 34px; }
.step { padding: 10px 22px; border-radius: 12px; border: 3px solid var(--line); color: #5d6874;
  white-space: nowrap; }
.step.done { color: var(--text); border-color: var(--ok); background: #0c2716; }
.arrow { color: #5d6874; font-size: 34px; }
#tlnone { font-size: 32px; color: var(--dim); }
#explain { font-size: 30px; margin-top: 12px; color: #e3e8ee; min-height: 36px;
  overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
  line-height: 1.25; }
#explain i { font-style: normal; color: var(--dim); }
footer { padding: 10px 48px; font-size: 24px; color: var(--dim); display: flex;
  justify-content: space-between; }
#clock { font-variant-numeric: tabular-nums; }
svg text { font-family: inherit; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
body.stale main { opacity: .4; }
.broken { animation: pulse 2s ease-in-out infinite; }
</style>
</head>
<body>
<div id="head" class="unknown"><div id="htext">Waiting for the board&#8230;</div>
  <div id="hsub"></div></div>
<div id="stale">Waiting for the board&#8230; no news from it for more than 5 s</div>
<main>
  <svg id="board" viewBox="0 0 900 780" preserveAspectRatio="xMidYMid meet" role="img"
       aria-label="NUCLEO-F446RE board">
    <g transform="translate(380 0)">
      <rect x="70" y="40" width="400" height="720" rx="16" fill="#1f2a36"
            stroke="#9fb2c6" stroke-width="4"/>
      <line x1="70" y1="215" x2="470" y2="215" stroke="#9fb2c6" stroke-width="2"
            stroke-dasharray="6 6"/>
      <rect x="230" y="14" width="80" height="44" rx="5" fill="#b8c2cc" stroke="#e5ebf0"
            stroke-width="2"/>
      <text x="270" y="44" text-anchor="middle" font-size="18" fill="#1a2028"
            font-weight="700">USB</text>
      <rect x="215" y="100" width="90" height="70" rx="4" fill="#0d1218" stroke="#4a5866"/>
      <text x="100" y="92" font-size="22" fill="#c8d2dc" font-weight="700">ST-LINK</text>
      <text x="100" y="200" font-size="18" fill="#8a9aab">NUCLEO-F446RE</text>
      <rect x="250" y="300" width="130" height="130" rx="6" fill="#0d1218" stroke="#4a5866"
            stroke-width="2"/>
      <text x="315" y="360" text-anchor="middle" font-size="18" fill="#c8d2dc"
            font-weight="700">STM32</text>
      <text x="315" y="383" text-anchor="middle" font-size="15" fill="#8a9aab">F446RE</text>
      <circle id="b1cap" cx="160" cy="290" r="34" fill="#4a5563" stroke="#cfe0ff"
              stroke-width="3"/>
      <text x="160" y="298" text-anchor="middle" font-size="22" fill="#fff"
            font-weight="800">B1</text>
      <circle cx="420" cy="260" r="20" fill="#111" stroke="#666" stroke-width="3"/>
      <text x="420" y="300" text-anchor="middle" font-size="14" fill="#8a9aab">RESET</text>
      <text x="92" y="448" font-size="20" fill="#c8d2dc" font-weight="700">CN8</text>
      <rect x="96" y="462" width="28" height="236" rx="4" fill="#06090c" stroke="#56667a"/>
      <text x="138" y="485" font-size="20" fill="#c8d2dc" font-weight="700">A0</text>
      <text x="138" y="526" font-size="20" fill="#c8d2dc" font-weight="700">A1</text>
      <text x="138" y="567" font-size="20" fill="#c8d2dc" font-weight="700">A2</text>
      <text x="138" y="608" font-size="20" fill="#c8d2dc" font-weight="700">A3</text>
      <text x="138" y="649" font-size="20" fill="#c8d2dc" font-weight="700">A4</text>
      <text x="138" y="690" font-size="20" fill="#c8d2dc" font-weight="700">A5</text>
    </g>
    <!-- stop button label, outside the board on the left -->
    <line id="b1lead" x1="370" y1="290" x2="506" y2="290" stroke="#7a8592" stroke-width="3"/>
    <text id="b1label" x="360" y="292" text-anchor="end" font-size="34" font-weight="800"
          fill="#7a8592">stop button</text>
    <text x="360" y="322" text-anchor="end" font-size="18" fill="#8c99a6">B1 &#183; PC13</text>
    <g id="pins"></g>
    <g id="wires"></g>
  </svg>
  <div id="rows"></div>
</main>
<div id="tl">
  <div id="steps"></div>
  <div id="explain"></div>
</div>
<footer><span id="foot">Everything runs on this NVIDIA GB10 &#8212; no internet. Model: Qwen3.6-35B-A3B.</span>
  <span id="clock"></span></footer>
<script>
"use strict";
var SVGNS = document.getElementById("board").namespaceURI;
var PIN_X = 490, PIN_Y0 = 478, PIN_DY = 41;
// device key, first pin, second pin, plain name, pin names
var WIRES = [["loopback", 0, 1, "test wire", "A0–A1 · PA0→PA1"],
             ["sensor", 2, 3, "sensor wire", "A2–A3 · PA4→PB0"],
             ["radio", 4, 5, "radio wire", "A4–A5 · PC1→PC0"]];
var COL = {ok: "#2ee06f", bad: "#ff3b3b", warn: "#ffb020", unknown: "#7a8592"};
var NAMES = {loopback: "Test wire", sensor: "Sensor wire", radio: "Radio wire",
             estop: "Stop button", power: "Power", temp: "Temperature"};
var ROWS = ["loopback", "sensor", "radio", "estop", "power", "temp"];

function el(tag, attrs, parent) {
  var e = document.createElementNS(SVGNS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function pinY(i) { return PIN_Y0 + i * PIN_DY; }
function setText(id, s) { document.getElementById(id).textContent = s; }
function has(v) { return v !== null && v !== undefined; }

var pinsG = document.getElementById("pins"), wiresG = document.getElementById("wires");
for (var i = 0; i < 6; i++)
  el("rect", {x: PIN_X - 8, y: pinY(i) - 8, width: 16, height: 16, fill: "#d4b44a"}, pinsG);
var wireEls = {};
WIRES.forEach(function (w) {
  var y1 = pinY(w[1]), y2 = pinY(w[2]), my = (y1 + y2) / 2, g = el("g", {}, wiresG);
  var d = "M" + PIN_X + " " + y1 + " C 380 " + (y1 - 8) + ", 380 " + (y2 + 8) + ", " +
          PIN_X + " " + y2;
  var path = el("path", {d: d, fill: "none", "stroke-width": 11, "stroke-linecap": "round"}, g);
  var gap = el("g", {}, g);  // the visible break for OPEN
  el("rect", {x: 386, y: my - 9, width: 30, height: 18, fill: "#0a0d12"}, gap);
  el("line", {x1: 380, y1: my - 16, x2: 420, y2: my - 4, stroke: COL.bad, "stroke-width": 5},
     gap);
  el("line", {x1: 380, y1: my + 16, x2: 420, y2: my + 4, stroke: COL.bad, "stroke-width": 5},
     gap);
  var gnd = el("g", {}, g);  // ground symbol for STUCK
  var gx = PIN_X - 34, gy = y2 + 12;
  el("line", {x1: gx, y1: y2 + 2, x2: gx, y2: gy + 6, stroke: COL.bad, "stroke-width": 4}, gnd);
  [[16, 6], [10, 12], [4, 18]].forEach(function (s) {
    el("line", {x1: gx - s[0], y1: gy + s[1], x2: gx + s[0], y2: gy + s[1], stroke: COL.bad,
                "stroke-width": 4}, gnd);
  });
  var label = el("text", {x: 360, y: my + 4, "text-anchor": "end", "font-size": 34,
                          "font-weight": 800}, g);
  label.textContent = w[3];
  var sub = el("text", {x: 360, y: my + 30, "text-anchor": "end", "font-size": 18,
                        fill: "#8c99a6"}, g);
  sub.textContent = w[4];
  wireEls[w[0]] = {g: g, path: path, gap: gap, gnd: gnd, label: label};
  setWire(w[0], "UNKNOWN", false);
});

function cls(state) {
  if (state === "OK" || state === "OFF") return "ok";
  if (state === "ON") return "warn";
  if (!state || state === "UNKNOWN") return "unknown";
  return "bad";
}
function setWire(name, state, incident) {
  var w = wireEls[name], c = cls(state);
  if (incident && c !== "bad") c = "bad";
  var color = COL[c];
  w.path.setAttribute("stroke", color);
  w.path.setAttribute("stroke-dasharray", c === "unknown" ? "4 14" : "none");
  w.gap.style.display = state === "OPEN" ? "" : "none";
  w.gnd.style.display = state === "STUCK" ? "" : "none";
  w.label.setAttribute("fill", color);
  w.g.setAttribute("class", c === "bad" ? "broken" : "");
}

var rowsDiv = document.getElementById("rows"), rowEls = {};
ROWS.forEach(function (n) {
  var r = document.createElement("div"); r.className = "row unknown";
  var ic = document.createElement("div"); ic.className = "ic"; ic.textContent = "?";
  var tx = document.createElement("div"); tx.className = "tx";
  var w = document.createElement("div"); w.className = "w";
  var t = document.createElement("div"); t.className = "t";
  tx.appendChild(w); tx.appendChild(t); r.appendChild(ic); r.appendChild(tx);
  rowsDiv.appendChild(r);
  rowEls[n] = {r: r, ic: ic, w: w, t: t};
});
var ICON = {ok: "✓", bad: "✕", warn: "!", unknown: "?"};
function setRow(n, c, word, tech) {
  var e = rowEls[n];
  e.r.className = "row " + c;
  e.ic.textContent = ICON[c];
  e.w.textContent = NAMES[n] + ": ";
  var b = document.createElement("b"); b.textContent = word; e.w.appendChild(b);
  e.t.textContent = tech || "";
}
ROWS.forEach(function (n) { setRow(n, "unknown", "unknown", ""); });
var LINK_WORD = {OK: "OK", OPEN: "loose", STUCK: "stuck"};

function fmtClock(t) {
  var d = new Date(t * 1000);
  function p(x) { return (x < 10 ? "0" : "") + x; }
  return p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
}
function fmtS(v) { return "+" + (v < 10 ? v.toFixed(1) : Math.round(v)) + " s"; }

function renderTimeline(sw) {
  var box = document.getElementById("steps");
  box.textContent = "";
  if (!sw) {
    var none = document.createElement("span"); none.id = "tlnone";
    none.textContent = "No problems so far.";
    box.appendChild(none);
    setText("explain", "");
    return;
  }
  var steps = [
    [has(sw.t0), "Problem seen" + (has(sw.t0) ? " " + fmtClock(sw.t0) : "")],
    [has(sw.alert_s), "Alert sent" + (has(sw.alert_s) ? " " + fmtS(sw.alert_s) : "")],
    [has(sw.explain_s), "AI explained" + (has(sw.explain_s) ? " " + fmtS(sw.explain_s) : "")],
    [has(sw.ticket), "Ticket" + (has(sw.ticket) ? " #" + sw.ticket : "")]];
  steps.forEach(function (s, k) {
    if (k) { var a = document.createElement("span"); a.className = "arrow";
             a.textContent = "→"; box.appendChild(a); }
    var d = document.createElement("span");
    d.className = "step" + (s[0] ? " done" : "");
    d.textContent = s[1];
    box.appendChild(d);
  });
  var ex = document.getElementById("explain");
  ex.textContent = "";
  if (sw.explain) {
    var i = document.createElement("i"); i.textContent = "AI: ";
    ex.appendChild(i); ex.appendChild(document.createTextNode(sw.explain));
  }
}

function waiting(sub) {
  document.getElementById("head").className = "unknown";
  setText("htext", "Waiting for the board…");
  setText("hsub", sub || "");
  document.getElementById("stale").className = "";
  document.body.className = "stale";
}

function render(st) {
  var h = st.headline || {level: "unknown", text: "Waiting for the board…", sub: ""};
  document.getElementById("head").className = h.level || "unknown";
  setText("htext", h.text || "");
  setText("hsub", h.sub || "");
  // the grey banner only when there is something else in the headline
  document.getElementById("stale").className =
    st.stale && h.level !== "unknown" ? "on" : "";

  document.body.className = st.stale ? "stale" : "";
  var dev = st.devices || {};
  WIRES.forEach(function (w) {
    var d = dev[w[0]] || {};
    setWire(w[0], d.state || "UNKNOWN", !!d.incident);
  });
  ["loopback", "sensor", "radio"].forEach(function (n) {
    var d = dev[n] || {}, s = d.state || "UNKNOWN", c = cls(s);
    if (d.incident && c !== "bad") c = "bad";
    var word = LINK_WORD[s] || "unknown";
    if (d.incident && s === "OK") word = "had a problem";
    setRow(n, c, word, (s === "UNKNOWN" ? "no reading" : s) + " · " + (d.pins || ""));
  });
  var es = (dev.estop || {}).state;
  setRow("estop", es === "ON" ? "warn" : es === "OFF" ? "ok" : "unknown",
         es === "ON" ? "pressed" : es === "OFF" ? "not pressed" : "unknown",
         "estop " + (es || "UNKNOWN") + " · B1");
  var cap = document.getElementById("b1cap");
  cap.setAttribute("fill", es === "ON" ? COL.warn : es === "OFF" ? "#2f6fff" : "#4a5563");
  var bc = es === "ON" ? COL.warn : es === "OFF" ? COL.ok : COL.unknown;
  document.getElementById("b1label").setAttribute("fill", bc);
  document.getElementById("b1lead").setAttribute("stroke", bc);
  cap.setAttribute("class", es === "ON" ? "broken" : "");

  if (has(st.vdd)) {
    setRow("power", st.vdd_low ? "bad" : "ok",
           (st.vdd_low ? "too low (" : "good (") + st.vdd.toFixed(2) + " V)",
           "VDD " + Math.round(st.vdd * 1000) + " mV");
  } else setRow("power", "unknown", "unknown", "VDD");
  if (has(st.temp)) setRow("temp", "ok", Math.round(st.temp) + " °C", "on-chip sensor");
  else setRow("temp", "unknown", "unknown", "");

  renderTimeline(st.stopwatch);
  if (st.footer) setText("foot", st.footer);
}

var busy = false;
function poll() {
  if (busy) return;
  busy = true;
  fetch("state.json", {cache: "no-store"}).then(function (r) { return r.json(); })
    .then(function (st) {
      try { render(st); } catch (e) { waiting(""); }
    }).catch(function () { waiting("The screen cannot reach the monitor right now."); })
    .then(function () { busy = false; });
}
setInterval(poll, 500);
function tick() { setText("clock", fmtClock(Date.now() / 1000)); }
setInterval(tick, 1000);
tick();
poll();
</script>
</body>
</html>
